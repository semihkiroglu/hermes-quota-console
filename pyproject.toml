[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-quota-console"
version = "0.1.3"
description = "A profile-aware quota, balance, and model dashboard plugin for Hermes Agent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Semih Kıroğlu", email = "semih@kiroglu.net" }]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/semihkiroglu/hermes-quota-console"
Repository = "https://github.com/semihkiroglu/hermes-quota-console"
Issues = "https://github.com/semihkiroglu/hermes-quota-console/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]
