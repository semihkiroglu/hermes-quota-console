name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run secret-safety gate
        run: python tools/check_secret_safety.py
      - name: Install test and build dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest pytest-cov fastapi httpx pydantic build hatchling
      - name: Run Python syntax checks
        run: python -m compileall -q dashboard tests tools
      - name: Validate manifest
        run: python -m json.tool dashboard/manifest.json >/dev/null
      - name: Validate dashboard bundle
        run: node --check dashboard/dist/index.js
      - name: Build wheel and verify package metadata
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/hermes-quota-console-dist"
          python -m zipfile -t "$RUNNER_TEMP/hermes-quota-console-dist/"*.whl
          python -m pip install --no-deps "$RUNNER_TEMP/hermes-quota-console-dist/"*.whl
          python -m pip check
      - name: Run offline fixture tests
        run: python -m pytest -q
