name: Tag and release

# Creates a version tag and GitHub release (v<project version from
# pyproject.toml>) after a change merges to stable. Versioning is manual:
# the maintainer bumps the version in pyproject.toml (patch for fixes,
# minor for features, major for breaking changes) when promoting to
# stable, and this workflow tags that exact version and publishes the
# release with auto-generated notes. Idempotent: if the tag/release
# already exists (manual tag or earlier merge) the run skips instead of
# failing or moving the tag. Runs on every stable push (no path filter)
# so the first release is picked up even when pyproject.toml arrives in
# the same push as this workflow file.

on:
  push:
    branches: [stable]

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read project version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
            echo "Tagged $TAG at $GITHUB_SHA"
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping"
          else
            # Release notes: short install/update guide on top of the
            # auto-generated changelog from merged pull requests.
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA" \
              -q .body > /tmp/release-notes.md
            printf '%s\n' \
              '## Install & update' \
              '' \
              'Stable branch, one clone then pull to update:' \
              '' \
              '```bash' \
              'git clone -b stable https://github.com/semihkiroglu/hermes-quota-console.git ~/.hermes/plugins/quota-console' \
              'git -C ~/.hermes/plugins/quota-console pull --ff-only' \
              '```' \
              '' \
              'Restart the dashboard after updating (Python changes require it):' \
              '' \
              '```bash' \
              'systemctl --user restart hermes-dashboard.service' \
              '```' \
              '' > /tmp/release-install.md
            cat /tmp/release-install.md /tmp/release-notes.md > /tmp/release.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release.md
            echo "Released $TAG"
          fi
